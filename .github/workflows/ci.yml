name: CI

on:
  push:
    branches:
      - 'main'
      - 'hyper'

  pull_request:
    branches:
      - 'main'
      - 'hyper'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
      - run: bun install
      - run: bun run typecheck
      - run: bun test
